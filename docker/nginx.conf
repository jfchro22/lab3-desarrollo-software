# Plantilla: el entrypoint sustituye __PORT__ por la variable PORT de la plataforma (8080 por omisión).
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La plataforma termina TLS y reenvía el protocolo original en X-Forwarded-Proto.
  map $http_x_forwarded_proto $app_https { default off; https on; }

  server {
    listen __PORT__;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API y verificación de estado -> Laravel (php-fpm)
    location ~ ^/(api/|up$) {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_param DOCUMENT_ROOT /var/www/html/public;
      fastcgi_param HTTPS $app_https;
      fastcgi_pass 127.0.0.1:9000;
    }

    # Front-end (SPA) -> archivos estáticos con respaldo a index.html
    location / {
      root /var/www/spa;
      try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }
  }
}
